<div class="container-fluid py-4">
  <div class="row g-4">
    
    <!-- LEFT PANEL: CARDS & SEARCH -->
    <div [class]="(selectedUser() || isCreating()) ? 'col-lg-5 col-xl-5' : 'col-12'">
      
      <!-- Top Search Control Bar -->
      <div class="d-flex gap-2 mb-3 align-items-center">
        <div class="flex-grow-1">
          <input 
            type="text" 
            class="form-control bg-white shadow-sm" 
            placeholder="Search by name or email..." 
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
          />
        </div>
        
        <select 
          class="form-select bg-white shadow-sm" 
          style="width: 140px;"
          [ngModel]="roleFilter()"
          (ngModelChange)="roleFilter.set($event)"
        >
          <option value="all">All Roles</option>
          <option value="admin">Admin</option>
          <option value="editor">Editor</option>
        </select>

        <button 
          type="button" 
          class="btn btn-primary d-flex flex-column align-items-center justify-content-center px-3 shadow-sm text-nowrap fw-bold"
          [class.active]="isCreating()"
          (click)="startCreate()"
          style="min-width: 90px; height: 38px;"
        >
          <span>+ New User</span>
        </button>
      </div>

      <!-- User List Cards -->
      <div class="d-flex flex-column gap-2">
        @for (userItem of filteredUsers(); track userItem.email) {
          <app-user-card 
            [user]="userItem" 
            [isSelected]="selectedUser()?.email === userItem.email"
            (select)="selectUser($event)"
          ></app-user-card>
        } @empty {
          <div class="card p-4 text-center text-muted border shadow-sm">
            No system users match your query.
          </div>
        }
      </div>

    </div>

    <!-- RIGHT PANEL: CONDITIONAL FORM (EDIT OR CREATE) -->
    <div class="col-lg-7 col-xl-7" *ngIf="selectedUser() || isCreating()">
      <div class="card border-0 shadow-sm p-4 bg-white">
        
        <!-- Top Close Button -->
        <div class="d-flex justify-content-end mb-2">
          <button type="button" class="btn-close" (click)="closePanel()" aria-label="Close"></button>
        </div>

        <!-- Feedback Alerts -->
        <div *ngIf="formError()" class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ formError() }}
          <button type="button" class="btn-close" (click)="formError.set('')"></button>
        </div>
        <div *ngIf="formSuccess()" class="alert alert-success alert-dismissible fade show" role="alert">
          {{ formSuccess() }}
          <button type="button" class="btn-close" (click)="formSuccess.set('')"></button>
        </div>

        <!-- MODE A: CREATE NEW USER -->
        <ng-container *ngIf="isCreating(); else editTemplate">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="h5 fw-bold mb-0 text-dark">Create New User Account</h3>
            <span class="badge bg-success-subtle text-success">Form Status: READY</span>
          </div>

          <form (ngSubmit)="registerUser()">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Full Name *</label>
              <input 
                type="text" 
                class="form-control" 
                placeholder="e.g. Jane Doe"
                [ngModel]="formName()" 
                (ngModelChange)="formName.set($event)"
                name="newName"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Email Address *</label>
              <input 
                type="email" 
                class="form-control" 
                placeholder="jane@example.com"
                [ngModel]="formEmail()" 
                (ngModelChange)="formEmail.set($event)"
                name="newEmail"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Account Role *</label>
              <select 
                class="form-select" 
                [ngModel]="formRole()" 
                (ngModelChange)="formRole.set($event)"
                name="newRole"
              >
                <option value="editor">Editor</option>
                <option value="admin">Administrator</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold text-secondary">Temporary Password *</label>
              <input 
                type="password" 
                class="form-control" 
                placeholder="••••••••"
                [ngModel]="formPassword()" 
                (ngModelChange)="formPassword.set($event)"
                name="newPassword"
                required
              />
            </div>

            <div class="d-flex gap-2 pt-2">
              <button type="submit" class="btn btn-primary flex-grow-1 py-2 fw-semibold">
                Create Account
              </button>
              <button type="button" class="btn btn-outline-secondary px-4" (click)="resetForm()">
                Reset
              </button>
            </div>
          </form>
        </ng-container>

        <!-- MODE B: EDIT SELECTED USER -->
        <ng-template #editTemplate>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h3 class="h5 fw-bold mb-1 text-dark">Edit User: {{ selectedUser()?.name }}</h3>
              <small class="text-muted">Target: {{ selectedUser()?.email }}</small>
            </div>
            <span class="badge bg-info-subtle text-info">Form Status: VALID</span>
          </div>

          <form (ngSubmit)="saveUserUpdate()">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Email Address</label>
              <input type="email" class="form-control bg-light" [value]="formEmail()" disabled />
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Full Name *</label>
              <input 
                type="text" 
                class="form-control" 
                [ngModel]="formName()" 
                (ngModelChange)="formName.set($event)"
                name="editName"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Account Role *</label>
              <select 
                class="form-select" 
                [ngModel]="formRole()" 
                (ngModelChange)="formRole.set($event)"
                name="editRole"
              >
                <option value="editor">Editor</option>
                <option value="admin">Administrator</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold text-secondary">Account Status *</label>
              <select 
                class="form-select" 
                [ngModel]="formStatus()" 
                (ngModelChange)="formStatus.set($event)"
                name="editStatus"
              >
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="d-flex justify-content-between align-items-center pt-2">
              <button type="submit" class="btn btn-primary flex-grow-1 py-2 me-3 fw-semibold">
                Save Changes
              </button>
              <button 
                type="button" 
                class="btn btn-link text-danger text-decoration-none px-2" 
                (click)="deleteUser()"
              >
                Delete Account
              </button>
            </div>
          </form>
        </ng-template>

      </div>
    </div>

  </div>
</div>
